interface:
  display_name: "pm-prd-write"
  short_description: "输出边界清晰、支持评审和研发交接的中文 PRD"
  default_prompt: "使用 $pm-prd-write 将已确认的产品方案整理成 PRD，明确 PRD/spec 边界，完成跨章节一致性审查；涉及页面体验时补充原型范围与页面状态规划；若要在设计前评估完整页面效果，建立页面内容契约和页面 × 状态 × 内容覆盖；复杂体验按信号补充页面地图、状态架构、组件行为、端与布局和覆盖计划，并按需交给 pm-prd-html 生成单文件 HTML。"

policy:
  allow_implicit_invocation: true
